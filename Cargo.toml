[package]
name = "mcpg-plugin-credential-static"
version = "0.1.0-alpha.18"
license = "Apache-2.0"
edition = "2024"
description = "Config-driven static credential_issuer plugin for MCPG (dev.mcpg.credential.static)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.16", version = "=0.1.0-beta.16" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["cdylib-export"]
cdylib-export = []
# Declared so the SDK's `declare_credential_issuer_plugin!`
# `build_static` accessor (gated `#[cfg(feature = "static-firstparty")]`)
# does not trigger `unexpected_cfgs` in consumer compilation. Empty:
# this plugin is consumed as a cdylib, not via the static-firstparty
# fast path.
static-firstparty = []
